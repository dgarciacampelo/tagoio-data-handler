<template id="qr-print-template">
    <!DOCTYPE html>
    <html lang="es">

    <head>
        <title>Cartel QR - __STATION_NAME__</title>
        <style>
            @media print {
                @page {
                    size: A5 portrait;
                    margin: 0;
                }

                body {
                    -webkit-print-color-adjust: exact;
                    print-color-adjust: exact;
                }
            }

            body {
                margin: 0;
                padding: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background-color: white;
                color: #1a1a1a;
            }

            .header {
                color: #00571b;
                font-size: 2.5rem;
                font-weight: bold;
                margin-bottom: 5px;
            }

            .subtitle {
                font-size: 1.5rem;
                color: #4a4a4a;
                margin-top: 0;
                margin-bottom: 25px;
            }

            .qr-container {
                padding: 15px;
                border: 3px solid #00571b;
                border-radius: 16px;
                display: inline-block;
            }

            .qr-image {
                width: 240px;
                height: auto;
            }

            .info-box {
                margin-top: 25px;
                text-align: center;
                font-size: 1.2rem;
                color: #4a4a4a;
                line-height: 1.4;
                overflow-wrap: break-word;
                max-width: 90%;
            }

            .info-box p {
                margin: 8px 0;
            }

            .bold {
                font-weight: bold;
                color: #1a1a1a;
            }
        </style>
    </head>

    <body>
        <div class="subtitle">Escanea para Recargar</div>

        <div class="qr-container">
            <img class="qr-image" src="__QR_DATA_URL__" alt="Código QR del Punto de Recarga" />
        </div>

        <div class="info-box">
            <p>Operador (CPO): <span class="bold">__CPO_NAME__</span></p>
            <p>Instalación: <span class="bold">__POOL_NAME__</span></p>
            <p>Estación: <span class="bold">__STATION_NAME__</span></p>
            <p>URL: <span class="bold">__TEXT_URL__</span></p>
        </div>
    </body>

    </html>
</template>
