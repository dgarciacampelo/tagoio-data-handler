# Compose file of the Go service (renamed to docker-compose.yml at the cutover, replacing the Python one).
# Same container name, port, network and database folder as before; the .env file is reused as it is.
services:
  tagoio-data-handler:
    container_name: tagoio-data-handler
    image: tagoio-data-handler:go
    build:
      context: .
      dockerfile: golang.Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    env_file:
      - .env
    environment:
      DB_PATH: /data/database.sqlite3
      # Local tests and staging: DRY_RUN=true logs the events, TagoIO writes and Telegram messages instead of sending them
      DRY_RUN: ${DRY_RUN:-false}
    ports:
      - "127.0.0.1:${API_PORT}:${API_PORT}"
    networks:
      - tagoio-data-network
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: 10m
    volumes:
      # The container gives this folder to its service user at start. DATA_DIR points a local test at a copy.
      - ${DATA_DIR:-./database_files}:/data:rw
    stop_grace_period: 20s
    restart: on-failure:5

networks:
  tagoio-data-network:
    name: tagoio_data_network
